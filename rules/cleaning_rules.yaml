# 数据清洗规则库 — 可复用清洗工作流的规则配置
# ----------------------------------------------------------------
# 用法: 新增噪音 = 在对应分组加一行，无需改代码。
#   修改后重跑: python cli/clean_batch.py
#
# 分组说明:
#   common  → 通用噪音(任何网站都可能出现: AI标记/备案/广告/阅读全文)
#   zhihu   → 知乎特有 UI/统计/推荐区噪音
#   未来爬新站(抖音/小红书/GitHub) → 新增站点分组, 把该站的 UI 词加进去
# ----------------------------------------------------------------
version: 4

# ① 固定噪音词: 行含任一子串 → 删整行
noise_substr:
  common:
    - "以上内容由 AI 生成"
    - "以上内容由AI生成"
    - "京ICP"
    - "下载同款"          # 广告: 下载同款简历模板
    - "简历神器"
    - "简历诊断"          # 广告: AI 简历诊断工具
    - "阅读全文"          # 推荐条目截断标记
    - "结果由 AI 大模型生成"  # AI 生成提示条
  zhihu:
    - "添加评论"
    - "展开更多"
    - "复制"
    - "分享"
    - "完成回答，用时"    # AI 辅助标记
    - "全部来源"
    - "内容发现"          # 推荐区标记
    - "相关搜索"
    - "大家都在搜"        # 尾部截断锚点
    - "换一换"
    - "深度搜索"
    - "篇内容 AI 总结"
    - "综合用户论文AI"    # 顶部导航
    - "搜索专栏盐选内容"  # 顶部导航
    - "写回答"            # UI 按钮
    - "订阅"
    - "精选专业知识库"
    - "权威内容专家精选"
    - "输入你的问题"      # AI 输入条
    - "快捷引用"
    - "0元做简历"         # 推广标题
    - "亲测好用"
    - "神级"
    - "秒杀"
    - "高光履历"
  video_ocr:             # 视频逐帧 OCR+视觉文本(media-to-notes 输出)
    - "====="            # 帧标记: ===== 帧 00:00 (第N/179帧) =====
    - "画面文字 OCR"     # OCR 标签
    - "GLM画面理解"      # GLM 视觉分析标签
    # 界面水印/学习标签(坚持打卡/片名/知识点等) 由 noise_regex 行首匹配删——
    #   不用 noise_substr(行含即删): GLM 画面描述会提到这些界面文字, 行含即删会误删描述

# ② 正则噪音: 行匹配即删(数字+赞同/评论/日期/相对时间/热搜/浏览量)
# 注意: 正则串用单引号(YAML 字面量), 反斜杠原样保留
noise_regex:
  - '[\d. ]+万?\s*赞同'            # 51 赞同 / 1.2 万赞同
  - '赞同\s*[\d. ]+万?'            # 赞同 1731 / 赞同 12万
  - '[\d.]+\s*条?\s*评论'          # 12 条评论 / 12 评论
  - '\d+\s*篇精选内容'             # 3 篇精选内容 · 129 万浏览
  - '^\d{4}[-/]\d{1,2}[-/]\d{1,2}$'  # 发布日期 2025-06-27
  - '^\d{1,2}[-/]\d{1,2}$'         # 短日期 06-08
  - '\d+\s*(分钟|小时|天)前'        # 56 分钟前 / 3 小时前
  - '^(昨天|前天|今天)\s*\d{1,2}:\d{2}'  # 昨天 15:28
  - '^热$'                         # 热搜"热"标记
  - '^\d[\d 万.]*万$'              # 浏览量 129 万
  # ── 视频转写: 界面水印/学习标签(独立行首匹配, 不误删 GLM 描述——描述以"画面"开头) ──
  - '^坚持打卡'                    # 水印: 坚持打卡30天听力口语突飞猛进
  - '^片名[：:]'                   # 水印: 片名：查莉成长日记
  - '^知识点\d+'                   # 学习标签: 知识点12345 / 678 / 91011121314
  - '^高手盲听'                    # 学习标签
  - '^初学看字幕'                  # 学习标签
  - '^纯英[文宇字]+幕$'            # 学习标签(OCR 错别字: 纯英文字幕/纯英文宇幕)
  - '^爱说英语的福安'              # 答主水印
  - '^爱悦英烫'                    # 答主水印(OCR 变体)
  # 注意: MILK/Dishuching/L-Lavndey 等是画面里的教学英文(GLM 描述"家务分类 D-Dishwashing"),
  #   是教学短行不是噪音, 保留不删(对应问题3"碎片 vs 教学短行"的边界判断)

# ③ 正文小节标题白名单: 即使频繁出现也保留(防止误删正文结构)
#   —— 独立成行"整行精确匹配"才生效; 行内含标点/带内容(如"重点: xxx")天然不匹配, 安全。
#   —— 2026-08-13 追加教学标题词(教学 md 无 # 标记的纯文本短标题, 防被当水印/答主名误删)。
#      "第一章 绪论"这类带序号的由代码 _is_heading_line 识别(见 cleaning.py), 无需枚举。
keep_headings:
  # ── 原: 简历场景标题词(开源通用保留) ──
  - "教育经历"
  - "求职意向"
  - "工作经历"
  - "项目经历"
  - "基本信息"
  - "专业技能"
  - "证书"
  - "自我评价"
  - "实习经历"
  - "荣誉奖项"
  - "技能证书"
  - "教育背景"
  - "联系方式"
  - "个人优势"
  - "项目经验"
  - "校园经历"
  # ── 新增: 教学章节标题词(独立成行即标题形态, 绝无正文句子恰好整行等于这些词) ──
  - "绪论"
  - "引言"
  - "概述"
  - "小结"
  - "总结"
  - "结语"
  - "结论"
  - "复习"
  - "练习"
  - "习题"
  - "作业"
  - "思考题"
  - "案例"
  - "举例"
  - "例题"
  - "定义"
  - "原理"
  - "概念"
  - "特点"
  - "分类"
  - "作用"
  - "意义"
  - "目标"
  - "重点"
  - "难点"
  - "拓展"
  - "延伸"
  - "参考资料"
  - "学习目标"
  - "随堂测验"
  - "课后作业"
  - "实战演练"
  - "知识拓展"
  - "温馨提示"
  - "注意事项"
  - "常见问题"
  - "易错点"
  - "预习"
  - "导入"
  - "导学"

# ④ 推荐栏目按钮: 独立短行精确匹配即删(句子中的词不受影响)
lanmu_buttons:
  - "量化成果"
  - "工具推荐"
  - "应届生急救"
  - "STAR法则"
  - "避坑指南"
  - "深度搜索"
  - "换一换"

# ⑤ 推荐问题标题: 独立短行以问号结尾, 或疑问词开头的短行
question_title:
  min_len: 3
  max_len: 30
  end_with: ["？", "?"]
  start_verbs:
    - "如何"
    - "怎么"
    - "怎样"
    - "为什么"
    - "哪些"
    - "什么"
    - "有啥"

# ⑥ 短行 UI 交互词(≤12字独立短行含即删): 点赞/收藏/关注等 OCR 按钮碎片
# 注意: 不能放 noise_substr(行含即删)——GLM 画面描述会提到这些词(如"界面有点赞收藏关注");
#   此处只删"独立短行"碎片, 长行描述不受影响
ui_short:
  video_ocr:
    - "点赞"
    - "收藏"
    - "关注"
    - "分享"

# ─────────────── ⑦ 多动作区块(R1, YAML v4): 转写内容保护 A-E ───────────────
# 转写内容保护: 区分教学(保/压缩) vs 噪音(删)。新增动作: protect/compress/merge。

# E. 教学短行保护: 词表外的教学词(课程专属词/专有名词) 加入此表, 清洗永不删
protect_teaching:
  teaching_words:
    - "listenup"
    - "nowthat"
    - "beableto"
    - "dovacation"
    - "lessstellar"
    - "lessthanstellar"
    - "stellaraccommodations"
    - "duncans"
    - "charlie"
    - "duncan"
    - "lucky"
    - "lucy"

# A. 台词重复压缩: 教学台词重复(视频反复播放) 压缩为"原文…[出现N次]", 不删除
compress_repeat:
  min_count: 3

# B. 界面水印: UI特征词+次数阈值(纯文本降级判据, 高配走时间戳/坐标)
watermark:
  min_count: 30

# C. OCR乱码: 最短长度(小于此长度不判乱码, 防误删短教学词)
garbled:
  min_len: 2

